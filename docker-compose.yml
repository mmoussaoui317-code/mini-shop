services:
  php:
    build:
      context: ./dockers/php
    restart: no
    volumes:
      - ./app/:/var/www/html/  # Mount the WordPress folder
      - ./volumes/uploads:/var/www/html/wp-content/uploads
      - ./dockers/php/wp-config.php:/var/www/html/wp-config.php
#      - ./dockers/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - db
  nginx:
    image: nginx:stable-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./app/:/var/www/html/ # Mount the WordPress folder
      - ./volumes/uploads:/var/www/html/wp-content/uploads
      - ./dockers/nginx/:/etc/nginx/conf.d/
    depends_on:
      - php
      - db
  db:
    image: mariadb:10.7
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/db/data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - UPLOAD_LIMIT=1G
      - PMA_ARBITRARY=1
    ports:
      - '8081:80'
